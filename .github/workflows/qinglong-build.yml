name: Build and Push QingLong Docker Image

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ============================================================
      # Login to GHCR
      # ============================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Login to Docker Hub
      # ============================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============================================================
      # Docker Buildx
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Check upstream QingLong digest
      # ============================================================

      - name: Check upstream QingLong image
        id: check
        shell: bash
        run: |
          set -e

          IMAGE="whyour/qinglong"
          TAG="debian"

          echo "Checking upstream image: ${IMAGE}:${TAG}"

          # Get Docker Hub registry token
          TOKEN="$(
            curl -fsSL \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${IMAGE}:pull" \
              | jq -r '.token'
          )"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to get Docker Hub registry token."
            exit 1
          fi

          echo "Docker Hub registry token acquired."

          # Get current manifest digest
          CURRENT_DIGEST="$(
            curl -fsSI \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://registry-1.docker.io/v2/${IMAGE}/manifests/${TAG}" \
              | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}' \
              | tr -d '\r' \
              | head -n1
          )"

          if [ -z "$CURRENT_DIGEST" ]; then
            echo "ERROR: Failed to get image digest."
            exit 1
          fi

          echo "Current digest: $CURRENT_DIGEST"

          # Read previously recorded digest
          OLD_DIGEST=""

          if [ -f .github/qinglong-base-digest.txt ]; then
            OLD_DIGEST="$(
              sed -n 's/^DIGEST=//p' \
                .github/qinglong-base-digest.txt \
                | head -n1
            )"
          fi

          echo "Old digest: $OLD_DIGEST"

          echo "digest=$CURRENT_DIGEST" >> "$GITHUB_OUTPUT"

          # Compare digests
          if [ "$CURRENT_DIGEST" = "$OLD_DIGEST" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "======================================"
            echo "Upstream QingLong image has NOT changed."
            echo "======================================"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "======================================"
            echo "Upstream QingLong image has CHANGED."
            echo "======================================"

          fi

      # ============================================================
      # Get upstream QingLong version
      # ============================================================

      - name: Get upstream QingLong version
        id: version
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e

          VERSION="$(
            curl -fsSL \
              https://raw.githubusercontent.com/whyour/qinglong/develop/version.yaml \
              | sed -n 's/^version:[[:space:]]*//p' \
              | head -n1
          )"

          if [ -z "$VERSION" ]; then
            VERSION="unknown"

          elif [[ "$VERSION" != v* ]]; then
            VERSION="v$VERSION"
          fi

          echo "Upstream QingLong version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Lowercase repository name
      # ============================================================

      - name: Set lowercase repository name
        id: lower-repo
        shell: bash
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Build and Push
      # ============================================================

      - name: Build and push Docker image
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true

          tags: |
            ghcr.io/${{ steps.lower-repo.outputs.repository }}/qinglong:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/qinglong:latest

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=QingLong Docker Image
            org.opencontainers.image.licenses=MIT

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # Update upstream digest record
      # ============================================================

      - name: Update upstream digest record
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          CURRENT_DIGEST: ${{ steps.check.outputs.digest }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          mkdir -p .github

          cat > .github/qinglong-base-digest.txt <<EOF
          IMAGE=whyour/qinglong:debian
          UPSTREAM_VERSION=$UPSTREAM_VERSION
          DIGEST=$CURRENT_DIGEST
          UPDATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          echo "======================================"
          echo "Updated digest record:"
          echo "======================================"

          cat .github/qinglong-base-digest.txt

      # ============================================================
      # Commit digest record
      # ============================================================

      - name: Commit digest record
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/qinglong-base-digest.txt

          git commit \
            -m "chore: update QingLong upstream image digest"

          git push origin "HEAD:${DEFAULT_BRANCH}"
